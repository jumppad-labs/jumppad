---
name: Build And Deploy
on:
  push:
    branches:
      - "**"
jobs:
  dagger_build:
    name: Dagger Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2

      - name: Set keys
        run: |
          echo "${{secrets.QUILL_SIGN_P12}}" | base64 -d  > ./cert.p12
          echo "${{secrets.QUILL_NOTORY_KEY}}" > ./key.p8
          echo "QUILL_SIGN_PASSWORD=${{secrets.QUILL_SIGN_PASSWORD}}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{secrets.GH_TOKEN}}" >> $GITHUB_ENV
      
      - name: All
        uses: dagger/dagger-for-github@v8.2.0
        with:
          verb: call
          module: ./dagger
          args: all --output=./output --src=. --github-token=GITHUB_TOKEN --notorize-cert=./cert.p12 --notorize-cert-password=QUILL_SIGN_PASSWORD --notorize-key=./key.p8 --notorize-id=${{secrets.QUILL_NOTARY_KEY_ID}} --notorize-issuer=${{secrets.QUILL_NOTARY_ISSUER}}
          version: "0.21.11"
          dagger-flags: "--progress=plain"

      - name: Dagger engine logs
        if: failure()
        run: docker ps -a --filter name=dagger-engine --format '{{.Names}}' | xargs -r -n1 docker logs --tail 200

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archives
          path: |
            ./output
    
      - name: Send status to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: ${{ github.job_id }}
          description: "Build application"

  functional_test_docker:
    name: Test Docker
    runs-on: ubuntu-latest
    needs: dagger_build

    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        folder: [
          '/container',
          '/build',
          '/docs',
          '/nomad',
          '/single_k3s_cluster',
          '/multiple_k3s_clusters',
          '/exec',
          '/certificates',
          '/terraform',
          '/registries',
          "/copy"
        ]

    steps:
      - name: Download-Binaries
        uses: actions/download-artifact@v4
        with:
          name: archives
          path: ./build_artifacts
      
      - name: Install binary executable
        run: |
          cp $(find ./build_artifacts -name "jumppad_*_linux_x86_64.tar.gz" -type f) ./build_artifacts/jumppad.tar.gz
          sudo tar -xzf ./build_artifacts/jumppad.tar.gz
          sudo mv ./jumppad /usr/local/bin/jumppad
          sudo chmod +x /usr/local/bin/jumppad

      - uses: actions/checkout@v2

      # The registries example pushes to registries that resolve to loopback and
      # use jumppad's own CA or plain HTTP. Docker's classic image store treated
      # loopback registries as insecure; the containerd image store, the default
      # for new Docker 29 installs, does not, so list them explicitly.
      - name: Allow example registries
        if: matrix.folder == '/registries'
        run: |
          cfg=/etc/docker/daemon.json
          [ -s "$cfg" ] || echo '{}' | sudo tee "$cfg" > /dev/null
          sudo jq '."insecure-registries" += [
            "noauth.container.local.jmpd.in:5000",
            "auth.container.local.jmpd.in:5001",
            "insecure.container.local.jmpd.in:5003"
          ]' "$cfg" | sudo tee "$cfg.new" > /dev/null
          sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          docker info --format 'driver={{.Driver}} insecure={{json .RegistryConfig.IndexConfigs}}'

      - name: All
        run: |
          jumppad test ./examples${{matrix.folder}}

      - name: Send status to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: ${{ github.job_id }}
          description: "Functional tests for docker: ${{matrix.folder}}"

  functional_test_podman:
    name: Test Podman
    runs-on: ubuntu-latest
    needs: dagger_build

    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        folder: [
          '/container',
          '/build',
          '/docs',
          '/nomad',
          '/single_k3s_cluster',
          '/multiple_k3s_clusters',
          '/exec',
          '/certificates',
          '/terraform',
        ]

    steps:
      - name: Download-Binaries
        uses: actions/download-artifact@v4
        with:
          name: archives
          path: ./build_artifacts
      
      - name: Install binary executable
        run: |
          cp $(find ./build_artifacts -name "jumppad_*_linux_x86_64.tar.gz" -type f) ./build_artifacts/jumppad.tar.gz
          sudo tar -xzf ./build_artifacts/jumppad.tar.gz
          sudo mv ./jumppad /usr/local/bin/jumppad
          sudo chmod +x /usr/local/bin/jumppad

      - uses: actions/checkout@v2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      #- name: Enable Podman socket
      #  run: |
      #    sudo systemctl start podman.socket
      #    sudo chmod 666 /run/podman/podman.sock
      #    podman info
      - name: Start Podman socket
        run: |
          sudo podman system reset --force
          sudo systemctl start podman.socket
          sudo chmod 755 /run/podman
          sudo chmod 666 /run/podman/podman.sock

      #- name: Debug Podman socket
      #  run: |
      #    # Check it's running
      #    sudo systemctl status podman.socket

      #    # Check socket exists
      #    ls -la /run/podman/podman.sock

      #    # Test the socket directly
      #    sudo curl -s --unix-socket /run/podman/podman.sock http://localhost/_ping

      #    # Check if your user can access it
      #    curl -s --unix-socket /run/podman/podman.sock http://localhost/_ping

      #    # Dump podman info
      #    podman info
      
      - name: Test
        env:
          DOCKER_HOST: unix:///run/podman/podman.sock
        run: |
          sudo LOG_LEVEL=DEBUG jumppad test ./examples${{matrix.folder}}

      #- name: Debug
      #  run: |
      #    echo "Running Containers"
      #    sudo podman ps --format "{{.Names}} {{.Ports}}"

      #    # Check if port is listening on host
      #    echo "Check Listeners"
      #    sudo ss -tlnp | grep 8500
      #    
      #    # Test from host using container IP
      #    echo "Curl source"
      #    curl -v http://127.0.0.1:8500

      - name: Send status to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: ${{ github.job_id }}
          description: "Functional tests for ${{matrix.folder}}"
  
  release:
    name: Create GitHub Release
    if: ${{ github.ref == 'refs/heads/main' }}

    needs: 
      - functional_test_docker
      - functional_test_podman
    environment:
      name: release
    runs-on: ubuntu-latest
    steps:
      - name: Set keys
        run: |
          echo "GITHUB_TOKEN=${{secrets.GH_TOKEN}}" >> $GITHUB_ENV
          echo "GEMFURY_TOKEN=${{secrets.FURY_TOKEN}}" >> $GITHUB_ENV
      
      - uses: actions/checkout@v2

      - name: Download-Binaries
        uses: actions/download-artifact@v4
        with:
          name: archives
          path: ./build_artifacts

      - name: Release
        uses: dagger/dagger-for-github@v8.2.0
        with:
          verb: call
          module: ./dagger
          args: release --src=. --github-token=GITHUB_TOKEN --gemfury-token=GEMFURY_TOKEN --archives=./build_artifacts --output=./version.txt
          version: "0.21.11"
          dagger-flags: "--progress=plain"
    
      - name: Set output
        id: setoutput
        run: |
          echo "version=$(cat ./version.txt)" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.setoutput.outputs.version }}

  sync_winget:
    name: Sync winget-pkgs repo
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: 
      - functional_test_docker
      - functional_test_podman
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync nicholasjackson/winget-pkgs -b master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  winget:
    name: Publish to WinGet
    needs:
      - release
      - sync_winget
    runs-on: windows-latest
    steps:
    - uses: jumppad-labs/winget-publish-action@v0.1.0
      with:
        publish-type: "Update"
        user: "jumppad"
        package: "jumppad"
        version: ${{ needs.release.outputs.version }}
        url: "https://github.com/jumppad-labs/jumppad/releases/download/${{ needs.release.outputs.version }}/jumppad_${{ needs.release.outputs.version }}_windows_x86_64.zip|x64"
        token: '${{ secrets.GH_TOKEN }}'

    - name: Send status to Discord
      uses: sarisia/actions-status-discord@v1
      if: always()
      with:
        title: ${{ github.job_id }}
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        description: "Push new version ${{ needs.github_release.outputs.version }} to Winget"